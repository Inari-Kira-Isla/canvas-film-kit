<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- FILL IN — film title -->
    <title>Canvas Film</title>
    <style>
      html, body { margin: 0; height: 100%; background: #0b0b10; overflow: hidden; }
      body { display: grid; place-items: center; }
      canvas { display: block; }
      #hud {
        position: fixed; left: 0; right: 0; bottom: 0; padding: 10px 16px 14px;
        font: 12px/1.3 ui-monospace, Menlo, monospace; color: #f2e8cf;
        background: linear-gradient(transparent, rgba(0,0,0,.55));
        opacity: 0; transition: opacity .4s; pointer-events: none;
      }
      #hud.on { opacity: 1; pointer-events: auto; }
      #bar { position: relative; height: 4px; background: rgba(242,232,207,.2); border-radius: 2px; margin-top: 6px; cursor: pointer; }
      #fill { position: absolute; inset: 0 auto 0 0; background: #ec7a3c; border-radius: 2px; }
      .tick { position: absolute; top: -3px; width: 1px; height: 10px; background: rgba(242,232,207,.45); }
    </style>
  </head>
  <body>
    <canvas id="stage"></canvas>
    <div id="hud"><span id="info"></span><div id="bar"><div id="fill"></div></div></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
